[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.7"
authors = ["xJeway"]
license = "MIT"
edition = "2021"

[workspace.dependencies]
mcp-manager-core = { path = "crates/mcp-manager-core" }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1.6"
tempfile = "3"
