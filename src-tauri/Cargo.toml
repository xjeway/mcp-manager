[package]
name = "mcp-manager"
version = "0.1.7"
description = "MCP Manager"
authors = ["xJeway"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1.6"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Marketplace HTTP client. Mirrors tauri-plugin-updater's TLS setup (rustls + ring)
# so no second TLS stack is pulled in.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
