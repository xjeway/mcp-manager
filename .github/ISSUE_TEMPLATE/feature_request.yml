name: 功能建议 / Feature request
description: 建议新功能，或希望支持新的客户端
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 现在哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposal
      description: 希望它怎么工作？如果是新客户端，请附上它的 MCP 配置文件路径和格式文档
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
