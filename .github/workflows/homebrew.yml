name: Publish Homebrew Cask and Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish to Homebrew, for example v0.1.6"
        required: true
        type: string
  # Called by release.yml: a release published with GITHUB_TOKEN does not
  # trigger the `release` event above.
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish to Homebrew"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_PAT:
        required: true

permissions:
  contents: read

jobs:
  publish-homebrew-cask:
    name: Publish Homebrew cask
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xjeway/homebrew-mcp-manager
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: Render cask and formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/homebrew-cask.mjs publish --tap-dir tap --owner xjeway --repo mcp-manager --tag "$RELEASE_TAG"

      - name: Commit tap update
        working-directory: tap
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          git add Casks/mcp-manager.rb
          if [[ -f Formula/mcpmgr.rb ]]; then
            git add Formula/mcpmgr.rb
          fi
          if git diff --cached --quiet; then
            echo "Homebrew tap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update mcp-manager cask and mcpmgr formula to $RELEASE_TAG"
          git push
