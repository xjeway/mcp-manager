name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release notes are built from the commits since the previous tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Generate release notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Ensure GitHub release exists
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: release-notes.md
        run: node scripts/github-release.mjs ensure "${{ github.ref_name }}"

  publish-tauri:
    name: Release (${{ matrix.name }})
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            platform: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_APPLE_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            rpm \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release args
        id: release_args
        shell: bash
        run: |
          echo "args=$(node scripts/release-args.mjs "${{ matrix.target }}" "${{ github.ref_name }}")" >> "$GITHUB_OUTPUT"

      - name: Run Tauri release (macOS signed + notarized)
        if: startsWith(matrix.platform, 'macos-') && env.HAS_APPLE_SIGNING == 'true' && env.HAS_APPLE_NOTARIZATION == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      - name: Run Tauri release (macOS signed)
        if: startsWith(matrix.platform, 'macos-') && env.HAS_APPLE_SIGNING == 'true' && env.HAS_APPLE_NOTARIZATION != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      - name: Run Tauri release (macOS unsigned)
        if: startsWith(matrix.platform, 'macos-') && env.HAS_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      - name: Run Tauri release (Windows signed)
        if: startsWith(matrix.platform, 'windows-') && env.HAS_WINDOWS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      - name: Run Tauri release (Windows unsigned)
        if: startsWith(matrix.platform, 'windows-') && env.HAS_WINDOWS_SIGNING != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      - name: Run Tauri release (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ steps.release_args.outputs.args }}
          includeUpdaterJson: false

      # One file per target so matrix jobs cannot overwrite each other.
      # CLI archives use SHA256SUMS-mcpmgr-* so they do not collide with these.
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="src-tauri/target/${TARGET}/release/bundle"
          sums="SHA256SUMS-${TARGET}.txt"
          : > "$sums"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.dmg|*.app.tar.gz|*.msi|*.exe|*.AppImage|*.deb|*.rpm|*.sig)
                openssl dgst -sha256 -r "$file" >> "$sums"
                ;;
            esac
          done < <(find "$root" -type f -print0)
          if [[ ! -s "$sums" ]]; then
            echo "No release artifacts found under $root" >&2
            exit 1
          fi
          sort -o "$sums" "$sums"
          node scripts/github-release.mjs upload-assets "${{ needs.prepare-release.outputs.release_id }}" "$sums"

  build-cli:
    name: CLI (${{ matrix.target }})
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with scripts/cli-targets.mjs.
        include:
          - target: aarch64-apple-darwin
            platform: macos-latest
          - target: x86_64-apple-darwin
            platform: macos-latest
          - target: aarch64-unknown-linux-musl
            platform: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            platform: ubuntu-22.04
          - target: aarch64-pc-windows-msvc
            platform: windows-11-arm
          - target: x86_64-pc-windows-msvc
            platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install musl tools
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build mcpmgr
        shell: bash
        env:
          # Static CRT so the Windows binary runs without the VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, '-windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p mcp-manager-cli --target ${{ matrix.target }}

      - name: Package archive
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin_dir="target/$TARGET/release"
          mkdir -p cli-dist
          cp LICENSE "$bin_dir/"
          if [[ "$TARGET" == *-windows-msvc ]]; then
            archive="mcpmgr-$TARGET.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$bin_dir/mcpmgr.exe','$bin_dir/LICENSE' -DestinationPath 'cli-dist/$archive'"
          else
            archive="mcpmgr-$TARGET.tar.gz"
            tar -C "$bin_dir" -czf "cli-dist/$archive" mcpmgr LICENSE
          fi
          echo "archive=cli-dist/$archive" >> "$GITHUB_OUTPUT"
          sums="cli-dist/SHA256SUMS-mcpmgr-$TARGET.txt"
          openssl dgst -sha256 -r "cli-dist/$archive" > "$sums"
          echo "sums=$sums" >> "$GITHUB_OUTPUT"

      - name: Upload binary for npm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcpmgr-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mcpmgr${{ contains(matrix.target, '-windows-msvc') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Upload archive to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs upload-assets "${{ needs.prepare-release.outputs.release_id }}" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.sums }}"

  publish-updater:
    name: Publish updater metadata
    needs:
      - prepare-release
      - publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs upload-updater "${{ needs.prepare-release.outputs.release_id }}"

  publish-npm:
    name: Publish npm packages
    needs:
      - build-cli
      - publish-updater
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token; no npm secret is stored.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mcpmgr-*
          path: cli-bin

      - name: Build npm packages
        run: node scripts/npm-packages.mjs build --tag "${{ github.ref_name }}" --binaries cli-bin --out npm-dist

      - name: Publish npm packages
        run: node scripts/npm-packages.mjs publish --out npm-dist

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare-release
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Publish the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs publish "${{ needs.prepare-release.outputs.release_id }}"

  publish-homebrew:
    name: Publish Homebrew cask and formula
    needs:
      - build-cli
      - publish-updater
      - publish-release
    # Same rule as isPrereleaseRef: tags like v1.2.3-beta.1 are prereleases.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
