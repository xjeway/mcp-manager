version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v1 breaks the release pipeline (updater json option, .app.tar.gz names
      # used by the Homebrew cask, release notes); migrate deliberately.
      - dependency-name: tauri-apps/tauri-action
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ["*"]
